<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamDJ — музика на стрімі</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:#0d0d0d;
  background-image:
    radial-gradient(circle at 15% 15%, rgba(100,65,165,.18), transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(64,224,208,.12), transparent 45%);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;padding:24px;overflow-x:hidden;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes glowPulse{
  0%,100%{box-shadow:0 0 30px rgba(100,65,165,.35), 0 0 0 1px #2a2a2a;}
  50%{box-shadow:0 0 55px rgba(64,224,208,.25), 0 0 0 1px #2a2a2a;}
}

.logo{font-family:'Unbounded',sans-serif;font-size:26px;font-weight:700;color:#fff;margin-bottom:4px;text-align:center;}
.logo span{background:linear-gradient(90deg,#8b6fd8,#40e0d0);-webkit-background-clip:text;background-clip:text;color:transparent;}
.tagline{font-size:12.5px;color:#666;margin-bottom:10px;text-align:center;}

.feature-strip{display:flex;gap:14px;margin-bottom:20px;}
.feature-strip span{font-size:16px;opacity:.55;cursor:default;transition:opacity .2s;}
.feature-strip span:hover{opacity:1;}

.lang-switcher{display:flex;gap:6px;margin-bottom:20px;}
.lang-btn{background:transparent;border:1px solid #2a2a2a;border-radius:8px;padding:5px 12px;font-size:11px;color:#555;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.2s;}
.lang-btn:hover{border-color:#6441a5;color:#aaa;}
.lang-btn.active{background:#6441a5;border-color:#6441a5;color:#fff;}

/* ── 3D flip card ── */
.flip-scene{width:100%;max-width:400px;perspective:1800px;animation:fadeUp .6s ease;}
.flip-card{
  position:relative;width:100%;min-height:660px;
  transform-style:preserve-3d;
  transition:transform .8s cubic-bezier(.6,-.28,.735,.045);
  animation:glowPulse 4s ease-in-out infinite;
  border-radius:24px;
}
.flip-card.flipped{transform:rotateY(180deg);}

.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:#161616;border:1px solid #2a2a2a;border-radius:24px;
  padding:36px 30px;display:flex;flex-direction:column;align-items:center;
  overflow-y:auto;
}
.face-back{transform:rotateY(180deg);}

.face-title{font-family:'Unbounded',sans-serif;font-size:20px;font-weight:600;color:#fff;text-align:center;margin-bottom:6px;}
.face-sub{font-size:12.5px;color:#666;text-align:center;margin-bottom:26px;}

/* ── inputs ── */
.input-group{width:100%;position:relative;margin-bottom:12px;}
.input-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.5;pointer-events:none;}
.text-input{
  width:100%;background:#1f1f1f;border:1px solid #2c2c2c;border-radius:12px;
  padding:14px 16px 14px 42px;font-size:13.5px;color:#eee;font-family:'Inter',sans-serif;
  transition:border-color .2s;
}
.text-input::placeholder{color:#555;}
.text-input:focus{outline:none;border-color:#40e0d0;}

.primary-btn{
  width:100%;border:none;border-radius:14px;padding:15px;margin-top:6px;
  font-size:13.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  font-family:'Unbounded',sans-serif;color:#0d0d0d;cursor:pointer;
  background:linear-gradient(90deg,#8b6fd8,#40e0d0);
  transition:transform .2s ease, box-shadow .2s ease;
}
.primary-btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(64,224,208,.25);}
.primary-btn:active{transform:translateY(0);}

.forgot-link{align-self:flex-end;font-size:11px;color:#666;cursor:pointer;margin-top:8px;}
.forgot-link:hover{color:#40e0d0;}

.divider{display:flex;align-items:center;gap:10px;width:100%;margin:22px 0 16px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#262626;}
.divider span{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.05em;}

/* ── social buttons ── */
.social-btns{width:100%;display:flex;flex-direction:column;gap:10px;}
.login-btn{
  width:100%;border:none;border-radius:14px;padding:13px 16px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:'Unbounded',sans-serif;display:flex;align-items:center;justify-content:center;gap:12px;
  transition:transform .2s ease, box-shadow .2s ease;letter-spacing:.01em;
}
.login-btn:hover{transform:translateY(-2px);}
.login-btn:active{transform:translateY(0);}
.btn-icon{width:18px;height:18px;flex-shrink:0;}

.btn-google{background:#fff;color:#333;}
.btn-google:hover{box-shadow:0 8px 24px rgba(66,133,244,.28);}

.btn-facebook{background:#1877F2;color:#fff;}
.btn-facebook:hover{box-shadow:0 8px 24px rgba(24,119,242,.35);}

.btn-playgames{background:#1a1a2e;color:#fff;border:1px solid #33334d;}
.btn-playgames:hover{box-shadow:0 8px 24px rgba(64,224,208,.2);}

.status-msg{font-size:12px;color:#e08080;margin-top:14px;text-align:center;min-height:16px;}
.status-msg.ok{color:#40e0d0;}

.switch-link{margin-top:22px;font-size:12.5px;color:#777;background:none;border:none;font-family:'Inter',sans-serif;cursor:pointer;}
.switch-link b{color:#40e0d0;font-weight:600;}
.switch-link:hover b{color:#8b6fd8;}

.hint{font-size:10.5px;color:#333;margin-top:20px;text-align:center;line-height:1.6;}
.hint span{color:#6441a5;}

/* ── планшети ── */
@media(max-width:768px){
  .flip-scene{max-width:440px;}
}
/* ── телефони: 3D-флип вимикаємо, просто показуємо/ховаємо ── */
@media(max-width:480px){
  body{padding:16px;}
  .flip-card{min-height:0;height:auto;}
  .face{position:relative;padding:28px 20px;border-radius:20px;}
  .flip-card.flipped .face-front{display:none;}
  .flip-card:not(.flipped) .face-back{display:none;}
  .flip-card.flipped{transform:none;}
  .face-back{transform:none;}
  .logo{font-size:22px;}
  .tagline{font-size:11.5px;}
  .login-btn{padding:13px;font-size:12px;}
}
/* ── дуже маленькі екрани ── */
@media(max-width:360px){
  .face{padding:22px 15px;}
  .logo{font-size:20px;}
  .lang-btn{padding:5px 9px;font-size:10px;}
}
/* ── ПК ── */
@media(min-width:1200px){
  .flip-scene{max-width:440px;}
  .logo{font-size:30px;}
}

@media(prefers-reduced-motion:reduce){
  .flip-card{transition:none;animation:none;}
  .login-btn,.primary-btn{transition:none;}
}
</style>
</head>

import {
  getAuth, signInWithPopup, GoogleAuthProvider, FacebookAuthProvider,
  signInWithEmailAndPassword, createUserWithEmailAndPassword,
  sendPasswordResetEmail, updateProfile,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD77vyKpxE-PDJhk4aS8N3_SBAIIwoXIKE",
  authDomain: "livemusicrequests-71c75.firebaseapp.com",
  databaseURL: "https://livemusicrequests-71c75-default-rtdb.firebaseio.com",
  projectId: "livemusicrequests-71c75",
  storageBucket: "livemusicrequests-71c75.firebasestorage.app",
  messagingSenderId: "841403842500",
  appId: "1:841403842500:web:4716afe909ddedec416e91",
  measurementId: "G-70G2MEMNGW"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Якщо вже залогінений — одразу на панель
onAuthStateChanged(auth, (user) => {
  if (user) window.location.href = './panel.html';
});

function setStatus(msg, face, ok) {
  const el = document.getElementById(face === 'back' ? 'status-back' : 'status-front');
  el.textContent = msg;
  el.classList.toggle('ok', !!ok);
}

function friendlyError(e) {
  const map = {
    'auth/invalid-email': T('errInvalidEmail'),
    'auth/user-not-found': T('errUserNotFound'),
    'auth/wrong-password': T('errWrongPassword'),
    'auth/invalid-credential': T('errWrongPassword'),
    'auth/email-already-in-use': T('errEmailInUse'),
    'auth/weak-password': T('errWeakPassword'),
    'auth/too-many-requests': T('errTooMany'),
    'auth/missing-password': T('errMissingFields'),
  };
  return map[e.code] || (T('error') + ': ' + (e.message || T('tryAgain')));
}

// ── Email / Password ──
window.loginEmail = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) { setStatus(T('errMissingFields'), 'front'); return; }
  setStatus(T('connectingEmail'), 'front');
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch(e) {
    setStatus(friendlyError(e), 'front');
  }
};

window.registerEmail = async function() {
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  if (!email || !password) { setStatus(T('errMissingFields'), 'back'); return; }
  if (password.length < 6) { setStatus(T('errWeakPassword'), 'back'); return; }
  setStatus(T('connectingEmail'), 'back');
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    if (name) await updateProfile(cred.user, { displayName: name });
  } catch(e) {
    setStatus(friendlyError(e), 'back');
  }
};

window.resetPassword = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) { setStatus(T('errEnterEmailFirst'), 'front'); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    setStatus(T('resetSent'), 'front', true);
  } catch(e) {
    setStatus(friendlyError(e), 'front');
  }
};

// ── Social ──
window.loginGoogle = async function() {
  const face = document.getElementById('flipCard').classList.contains('flipped') ? 'back' : 'front';
  setStatus(T('connectingGoogle'), face);
  try {
    await signInWithPopup(auth, new GoogleAuthProvider());
  } catch(e) {
    setStatus(friendlyError(e), face);
  }
};

window.flip = function(toBack) {
  document.getElementById('flipCard').classList.toggle('flipped', toBack);
  setStatus('', 'front'); setStatus('', 'back');
};

    errWrongPassword: 'Неверный пароль',
    errEmailInUse: 'Эта почта уже зарегистрирована',

};

let currentLang = localStorage.getItem('dj_lang') || 'uk';

function T(key) {
  return TRANSLATIONS[currentLang][key] || TRANSLATIONS['uk'][key] || key;
}

window.setLang = function(lang) {
  currentLang = lang;
  localStorage.setItem('dj_lang', lang);
  applyLang();
};

function applyLang() {
  const map = { uk: 0, en: 1, ru: 2 };
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.lang-btn')[map[currentLang]]?.classList.add('active');

  document.getElementById('tagline').textContent = T('tagline');
  document.getElementById('loginTitle').textContent = T('loginTitle');
  document.getElementById('loginSub').textContent = T('loginSub');
  document.getElementById('loginEmail').placeholder = T('emailPlaceholder');
  document.getElementById('loginPassword').placeholder = T('passwordPlaceholder');
  document.getElementById('forgotLink').textContent = T('forgotLink');
  document.getElementById('loginSubmitText').textContent = T('loginSubmit');
  document.getElementById('dividerOr1').textContent = T('dividerOr');
  document.getElementById('dividerOr2').textContent = T('dividerOr');
  document.getElementById('toRegisterText').innerHTML = T('toRegister');

  document.getElementById('regTitle').textContent = T('regTitle');
  document.getElementById('regSub').textContent = T('regSub');
  document.getElementById('regName').placeholder = T('namePlaceholder');
  document.getElementById('regEmail').placeholder = T('emailPlaceholder');
  document.getElementById('regPassword').placeholder = T('passwordHintPlaceholder');
  document.getElementById('regSubmitText').textContent = T('regSubmit');
  document.getElementById('toLoginText').innerHTML = T('toLogin');

  document.getElementById('hint').innerHTML = T('hint');

  document.querySelectorAll('.i18n[data-key]').forEach(el => {
    el.textContent = T(el.getAttribute('data-key'));
  });

  const titles = {
    uk: 'StreamDJ — музика на стрімі',
    en: 'StreamDJ — stream music',
    ru: 'StreamDJ — музыка на стриме'
  };
  document.title = titles[currentLang];
}

applyLang();
</script>
